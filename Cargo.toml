[package]
name = "rusty_measurement_runner"
version = "0.1.0"
edition = "2024"

[dependencies]
# command line parser
clap = {version = "4.6.1", features = ["derive"] }

# loading .toml files
toml = "1.1.2"

serde = { version = "1.0", features = ["derive"] }

itertools = "0.14.0"

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

indicatif = "0.18.4"